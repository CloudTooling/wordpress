annotations:
  fips: "true"
  images: |
    - name: apache-exporter
      version: 1.1.1
      image: registry-1.docker.io/bitnami/apache-exporter:latest
    - name: os-shell
      version: "5"
      image: registry-1.docker.io/bitnami/os-shell:latest
    - name: wordpress
      version: 7.0.0
      image: docker.io/cloudtooling/wordpress:7.0.0
  licenses: Apache-2.0
  tanzuCategory: application
apiVersion: v2
# renovate: datasource=github-tags depName=WordPress/WordPress
appVersion: 7.0.1
dependencies:
- condition: memcached.enabled
  name: memcached
  repository: oci://registry-1.docker.io/bitnamicharts
  version: 8.x.x
- condition: mariadb.enabled
  name: mariadb
  repository: oci://registry-1.docker.io/bitnamicharts
  version: 26.x.x
- name: common
  repository: oci://registry-1.docker.io/bitnamicharts
  tags:
  - bitnami-common
  version: 2.x.x
description: "WordPress is the world's most popular blogging and content management platform. Powerful yet simple, everyone from students to global corporations use it to build beautiful, functional websites."
home: https://github.com/CloudTooling
icon: https://dyltqmyl993wv.cloudfront.net/assets/stacks/wordpress/img/wordpress-stack-220x234.png
keywords:
- application
- blog
- cms
- http
- php
- web
- wordpress
maintainers:
- name: Martin Reinhardt
  url: https://m13t.de
name: wordpress
sources:
- https://github.com/CloudTooling/wordpress
version: 1.0.2
